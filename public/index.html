<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07080c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="経理">
  <title>REConos 経理</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/styles.css?v=0.1.0">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7a5cff"/><stop offset="1" stop-color="#0a6cff"/>
      </linearGradient>
    </defs>
  </svg>
  <div id="app">
    <!-- 起動中の全画面スケルトン（JS が読み込まれる前から出す） -->
    <div class="shell sk-fade">
      <main class="main">
        <div class="topbar"></div>
        <div class="sk sk-title"></div>
        <div class="grid">
          <div class="glass card hero"><div class="hero-row"><div><div class="sk sk-line" style="width:30%"></div><div class="sk sk-big"></div><div class="sk sk-line" style="width:50%"></div></div><div class="sk sk-circle"></div></div></div>
          <div class="stats"><div class="glass stat"><div class="sk sk-line"></div><div class="sk sk-line" style="height:20px"></div></div><div class="glass stat"><div class="sk sk-line"></div><div class="sk sk-line" style="height:20px"></div></div><div class="glass stat"><div class="sk sk-line"></div><div class="sk sk-line" style="height:20px"></div></div></div>
          <div class="glass card"><div class="sk sk-line" style="width:24%"></div><div class="sk-bars"><div class="sk" style="height:40%"></div><div class="sk" style="height:65%"></div><div class="sk" style="height:50%"></div><div class="sk" style="height:80%"></div><div class="sk" style="height:35%"></div><div class="sk" style="height:60%"></div><div class="sk" style="height:45%"></div><div class="sk" style="height:70%"></div></div></div>
        </div>
      </main>
      <nav class="tabbar glass"></nav>
    </div>
  </div>
  <script type="module" src="/app.js?v=0.1.0"></script>
</body>
</html>
