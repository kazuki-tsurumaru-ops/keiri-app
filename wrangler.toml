name = "keiri-app"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]

[[d1_databases]]
binding = "DB"
database_name = "keiri-app"
database_id = "00000000-0000-0000-0000-000000000000" # wrangler d1 create keiri-app で出た ID に書き換える
migrations_dir = "migrations"

[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# ログインを許可するメールアドレス（カンマ区切り）。「@example.com」でドメイン単位
ALLOWED_EMAILS = "@reconosinc.com"
